<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SETHES - Design Atelier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@200;300;400;500;600;700&family=Inter:wght@100;200;300;400;500&family=Oswald:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f4f4f4;
        color: #171719;
        overflow-x: hidden;
      }
      h1, h2, h3, .font-condensed {
        font-family: 'Barlow Condensed', sans-serif;
        text-transform: uppercase;
      }
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      /* Precision selection for premium feel */
      ::selection {
        background: black;
        color: white;
      }
      /* Custom button/link tracking to match the DIN feel */
      .premium-tracking {
        letter-spacing: 0.15em;
      }

      /* FIX: Force input and textarea selection */
      input, textarea {
        user-select: text !important;
        -webkit-user-select: text !important;
        pointer-events: auto !important;
        cursor: text !important;
      }
      
      /* Ensure parent containers don't block interaction */
      form, .form-group, label {
        user-select: text !important;
        -webkit-user-select: text !important;
      }
    </style>

  }
}
</script>
